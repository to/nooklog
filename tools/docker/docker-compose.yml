services:
  nooklog:
    image: nooklog-app
    build:
      context: ../..
      dockerfile: tools/docker/Dockerfile
    container_name: nooklog-app
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ../../data:/app/data
    environment:
      - NODE_ENV=production
      - NOOKLOG_DATA_PATH=/app/data
      # 🚀 To use Turso mode, just provide the database URL and Auth Token.
      # (If URL is empty, it runs in local-only mode)
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - TURSO_REPLICA=${TURSO_REPLICA:-true}
