<!DOCTYPE html>
<html>

<head>
	<script src="./init.js"></script>
	<meta charset="UTF-8">
	<title>Nooklog - Extension Settings</title>
	<link rel="stylesheet" href="../public/css/token.css">
	<link rel="stylesheet" href="../public/css/reset.css">
	<link rel="stylesheet" href="../public/css/layout.css">
	<link rel="stylesheet" href="../public/css/theme.css">
	<link rel="stylesheet" href="../public/css/app.css">
	<link rel="stylesheet" href="../public/css/config.css">
</head>

<body>
	<form id="form-config" class="flex flex-col h-full">
		<div class="grid items-center" style="grid-template-columns: max-content 1fr;">
			<h2>Nooklog - Extension Settings</h2>

			<div>
				<label>Server Address</label>
				<input type="text" name="extension.serverAddress" placeholder="http://localhost:5050">
				<span class="description">NooklogサーバーのURLアドレス</span>
				<span id="error" class="description error none">Server not found. Please check if the server is running.</span>
			</div>
		</div>

		<footer class="flex">
			<button type="submit" class="ml-auto">Save</button>
		</footer>
	</form>

	<script src="../public/js/util.js"></script>
	<script src="SettingPage.js"></script>
</body>

</html>
