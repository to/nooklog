<!DOCTYPE html>
<html lang="en">

<head>
	<script>
		document.documentElement.classList.add(localStorage.theme ??
			(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
		document.documentElement.lang = navigator.language.slice(0, 2);
	</script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nookmark</title>
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">
	<link rel="stylesheet" href="css/color.css">
	<link rel="stylesheet" href="css/token.css">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/theme.css">
	<link rel="stylesheet" href="css/app.css">
	<link rel="stylesheet" href="css/search.css">
</head>

<body>
	<header class="flex shrink-0 items-end justify-end">
		<button id="themeToggle" class="btn-flat">
			<span class="material-symbols-outlined">dark_mode</span>
		</button>
	</header>
	<form id="searchForm" class="search-form w-full gap-0">
		<div class="grid items-center gap-xs" style="grid-template-columns: 1fr auto;">
			<input name="tags" placeholder="Tags">
			<input type="text" id="query" placeholder="Query" class="row-2">
			<div class="select-flat col-2 row-2">
				<label><input type="checkbox" name="field" value="url" checked>URL</label>
				<label><input type="checkbox" name="field" value="title" checked>Title</label>
				<label> <input type="checkbox" name="field" value="memo" checked>Memo</label>
			</div>
		</div>
		<div class="radio-flat self-end">
			<label> <input type="radio" name="sortBy" value="created_at" checked>Created</label>
			<label> <input type="radio" name="sortBy" value="updated_at">Updated</label>
			<label> <input type="radio" name="sortBy" value="rating">Rating</label>
		</div>
		<button type="submit" class="none">Search</button>
	</form>

	<div id="loading" class="loading none">...</div>
	<table id="resultsTable" class="results-table none">
		<tbody id="resultsBody"></tbody>
	</table>

	<script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
	<script src="js/util.js"></script>
	<script src="js/TagInput.js"></script>
	<script src="js/Nookmark.js"></script>
	<script src="js/ThemeToggle.js"></script>
	<script src="js/SearchPage.js"></script>
</body>

</html>
