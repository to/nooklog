<!DOCTYPE html>
<html lang="en">

<head>
	<script src="js/init.js"></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Rating Demo - Nookmark</title>
	<link rel="stylesheet" href="lib/material-symbols/material-symbols.css">
	<link rel="stylesheet" href="css/token.css">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/theme.css">
	<link rel="stylesheet" href="css/app.css">
	<style>
		.demo-container {
			max-width: 400px;
			margin: 40px auto;
			padding: var(--space-m);
			border: 1px solid var(--color-2);
			border-radius: var(--radius-m);
			background: var(--color-0);
		}

		.rating-value {
			font-weight: bold;
			color: var(--color-5);
		}
	</style>
</head>

<body>
	<div class="demo-container flex flex-col gap-m">
		<h2 class="m-0">Rating Component Demo</h2>

		<div class="flex items-center gap-s">
			<label>Score:</label>
			<input type="number" id="rating" value="3" min="0" max="5">
		</div>

		<div class="flex items-center gap-s">
			<span>Display:</span>
			<span id="display-value" class="rating-value">3</span>
		</div>

		<button type="button" id="btn-reset" class="self-start">Set to 5</button>
	</div>

	<script src="js/util.js"></script>
	<script src="js/RatingInput.js"></script>
	<script>
		const input = $('#rating');
		const display = $('#display-value');
		const btn = $('#btn-reset');

		// 初期化
		const rating = new RatingInput(input);

		// 値の変更を監視
		input.addEventListener('change', () => {
			display.textContent = input.value;
		});

		// 外部からの操作テスト
		btn.addEventListener('click', () => {
			rating.setValue(5);
			display.textContent = 5;
		});
	</script>
</body>

</html>
