<!DOCTYPE html>
<html lang="en">

<head>
	<script src="js/init.js"></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nookmark</title>
	<link rel="icon" type="image/png" sizes="192x192" href="icon_48.png">
	<link rel="stylesheet" href="lib/material-symbols/material-symbols.css">
	<link rel="stylesheet" href="lib/tagify/tagify.css">
	<link rel="stylesheet" href="css/tagify.css">
	<link rel="stylesheet" href="css/token.css">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/theme.css">
	<link rel="stylesheet" href="css/app.css">
	<link rel="stylesheet" href="css/update.css">
</head>

<body>
	<header class="hidden shrink-0 justify-end">
		<button type="button" id="btn-detach" class="btn-flat">
			<span class="icon">open_in_new</span>
		</button>
		<button type="button" id="btn-close" class="btn-flat">
			<span class="icon">close</span>
		</button>
	</header>

	<form id="form-update" class="flex flex-col h-full">
		<input type="text" id="url" required>
		<input type="text" id="title" placeholder="Title" required>
		<input name="tags" placeholder="Tags">
		<textarea id="memo" placeholder="Memo"></textarea>
		<input type="hidden" id="html">
		<button type="submit">Save</button>
		<div id="error" class="error none"></div>
	</form>

	<script src="lib/tagify/tagify.js"></script>
	<script src="js/util.js"></script>
	<script src="js/TagInput.js"></script>
	<script type="module" src="update.mjs"></script>
</body>

</html>
