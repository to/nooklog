<!DOCTYPE html>
<html lang="en">

<head>
	<script>
		document.documentElement.classList.add(localStorage.theme ??
			(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
		document.documentElement.lang = navigator.language.slice(0, 2);
	</script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nookmark Update</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">
	<link rel="stylesheet" href="css/token.css">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/theme.css">
	<link rel="stylesheet" href="css/app.css">
</head>

<body>
	<form id="updateForm" class="h-full">
		<input type="hidden" id="html">
		<input type="text" id="url" required>
		<input type="text" id="title" placeholder="Title" required>
		<input name="tags" placeholder="Tags">
		<textarea id="memo" placeholder="Memo"></textarea>
		<button type="submit">Save</button>
		<div id="error" class="error"></div>
	</form>

	<script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
	<script src="js/util.js"></script>
	<script src="js/TagInput.js"></script>
	<script src="js/Nookmark.js"></script>
	<script src="js/UpdateForm.js"></script>
</body>

</html>
