<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Nooklog Settings</title>
	<style>
		:root {
			--background: #151515;
			--foreground: #eee;
			--error: #e62;
		}

		body {
			background: var(--background);
			color: var(--foreground);
			font: 1rem sans-serif;
			margin: 0;
			display: grid;
			place-items: center;
			min-height: 100vh;
		}

		form {
			width: 18rem;
			display: grid;
			gap: 0.5rem;
		}

		input,
		button {
			border-radius: 0.2rem;
		}

		input {
			background: none;
			border: 1px solid var(--foreground);
			color: inherit;
			padding: 0.5rem;
		}

		button {
			background: var(--foreground);
			cursor: pointer;
			color: var(--background);
			border: 0;
			padding: 0.5rem 1rem;
			justify-self: end;
		}

		#error {
			color: var(--error);
		}

		.none {
			display: none;
		}
	</style>
</head>

<body>
	<form class="SettingForm">
		<label>Nooklog Server URL</label>
		<input name="extension.serverAddress" placeholder="http://localhost:5050">
		<div id="error" class="none">Server not found.</div>
		<button type="submit">Save</button>
	</form>
	<script src="SettingForm.js"></script>
</body>

</html>
